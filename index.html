<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>♥ Nuestro pequeño rincón del universo ♥</title>
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@500;700&family=Great+Vibes&family=Playfair+Display:ital,wght@0,400;1,400&family=Cinzel:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/estilos.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌑</text></svg>">
</head>
<body>

<!-- ═══════════════════ PANTALLA DE CARGA ═══════════════════ -->
<div id="pantalla-carga">
  <div class="carga-inner">
    <div class="carga-corazon">💜</div>
    <h1 class="carga-titulo">Nuestro rincón del universo</h1>
    <p class="carga-sub">Ingresa la contraseña para entrar</p>
    <div class="carga-inputs">
      <input class="carga-input" id="ci1" type="text" maxlength="2" placeholder="DD" oninput="avanzarCarga(this,'ci2',2)">
      <span class="carga-guion">-</span>
      <input class="carga-input" id="ci2" type="text" maxlength="1" placeholder="M" oninput="avanzarCarga(this,'ci3',1)">
      <span class="carga-guion">-</span>
      <input class="carga-input" id="ci3" type="text" maxlength="2" placeholder="AA" oninput="avanzarCarga(this,null,2)">
    </div>
    <button class="carga-btn" onclick="verificarClave()">Entrar ✨</button>
    <p class="carga-err hidden" id="carga-err">❌ Contraseña incorrecta, inténtalo de nuevo</p>
  </div>
</div>

<div id="stars-bg"></div>
<div id="music-btn" onclick="toggleMusic()" title="Música">🎵</div>

<audio id="bg-music" loop>
  <source src="audio/Taylor Swift - Lover (Official Music Video).mp3" type="audio/mpeg">
</audio>

<audio id="snd-unlock" preload="auto">
  <source src="audio/unlock.mp3" type="audio/mpeg">
</audio>
<audio id="snd-ring" preload="auto">
  <source src="audio/ring.mp3" type="audio/mpeg">
</audio>

<!-- ═══ MENÚ ═══ -->
<section id="sec-menu" class="sec" style="opacity:0">
  <div class="menu-header">
    <div class="menu-corazon-anim">💜</div>
    <h2 class="t">Mi linda princesa 💫</h2>
    <p class="sub">Esta pequeña sección está hecha para que puedas ver y sentir un poco de la obsesión que siento por ti</p>
    <div class="contador-juntos" id="contador-juntos"></div>
  </div>
  <div class="menu-grid">
    <div class="menu-card" onclick="ir('sec-constelacion')">
      <span class="ic">✨</span>
